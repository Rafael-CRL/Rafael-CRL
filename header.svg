<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" width="860" height="320" role="img" aria-labelledby="t">
  <title id="t">Rafael Cristo Lobato — Sistemas de Informação, UFPA</title>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .in { animation: up .6s cubic-bezier(.2,.7,.2,1) both; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .3s; } .d3 { animation-delay: .5s; }
    .d4 { animation-delay: .7s; } .d5 { animation-delay: .9s; } .d6 { animation-delay: 1.1s; }
    @keyframes up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .k { fill: #e3b341; }
    .v { fill: #c9d1d9; }
    .chip rect { fill: #161b22; stroke: #30363d; }
    .chip text { fill: #c9d1d9; font-size: 13px; }
    @media (prefers-reduced-motion: reduce) { .in { animation: none; } }
  </style>

  <rect x="0.5" y="0.5" width="859" height="319" rx="14" fill="#0d1117" stroke="#30363d"/>

  <!-- prompt -->
  <g class="in d1">
    <text x="40" y="50" class="mono" font-size="14" fill="#8b949e">rafael@ufpa <tspan class="k">~ $</tspan> fastfetch</text>
  </g>

  <!-- identidade -->
  <g class="in d2">
    <text x="40" y="110" class="sans" font-size="36" font-weight="600" fill="#e6edf3">Rafael Cristo Lobato</text>
    <text x="40" y="142" class="sans" font-size="16" fill="#c9d1d9">Completamente aficionado por computação.</text>
    <text x="40" y="167" class="sans" font-size="14" fill="#8b949e">Sistemas de Informação · UFPA · Pará</text>
  </g>

  <g class="in d3">
    <text x="40" y="214" class="mono" font-size="14" fill="#c9d1d9"><tspan class="k">&gt;</tspan> java · linux · backend · automação · IA <tspan class="k">▋<animate attributeName="fill-opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  </g>

  <!-- fastfetch -->
  <line x1="490" y1="78" x2="490" y2="242" stroke="#30363d"/>
  <g class="in d4 mono" font-size="13">
    <text x="516" y="92"><tspan class="k" font-weight="700">rafael</tspan><tspan fill="#8b949e">@</tspan><tspan class="k" font-weight="700">ufpa</tspan></text>
    <text x="516" y="110" fill="#30363d">───────────</text>
    <text x="516" y="132"><tspan class="k">OS</tspan><tspan class="v" x="608">Ubuntu</tspan></text>
    <text x="516" y="152"><tspan class="k">Shell</tspan><tspan class="v" x="608">zsh</tspan></text>
    <text x="516" y="172"><tspan class="k">Editor</tspan><tspan class="v" x="608">Intellij/Nvim</tspan></text>
    <text x="516" y="192"><tspan class="k">Terminal</tspan><tspan class="v" x="608">alacritty</tspan></text>
    <text x="516" y="212"><tspan class="k">Self-host</tspan><tspan class="v" x="608">Docker</tspan></text>
  </g>
  <g class="in d5">
    <rect x="516" y="230" width="18" height="12" fill="#30363d"/>
    <rect x="534" y="230" width="18" height="12" fill="#f85149"/>
    <rect x="552" y="230" width="18" height="12" fill="#3fb950"/>
    <rect x="570" y="230" width="18" height="12" fill="#e3b341"/>
    <rect x="588" y="230" width="18" height="12" fill="#58a6ff"/>
    <rect x="606" y="230" width="18" height="12" fill="#bc8cff"/>
    <rect x="624" y="230" width="18" height="12" fill="#39c5cf"/>
    <rect x="642" y="230" width="18" height="12" fill="#c9d1d9"/>
  </g>

  <!-- stack -->
  <line x1="40" y1="256" x2="820" y2="256" stroke="#21262d"/>
  <g class="in d6 mono">
    <g class="chip"><rect x="40"  y="272" width="56" height="26" rx="6"/><text x="68"  y="289.5" text-anchor="middle">Java</text></g>
    <g class="chip"><rect x="104" y="272" width="64" height="26" rx="6"/><text x="136" y="289.5" text-anchor="middle">Linux</text></g>
    <g class="chip"><rect x="176" y="272" width="72" height="26" rx="6"/><text x="212" y="289.5" text-anchor="middle">Python</text></g>
    <g class="chip"><rect x="256" y="272" width="72" height="26" rx="6"/><text x="292" y="289.5" text-anchor="middle">Docker</text></g>
    <g class="chip"><rect x="336" y="272" width="80" height="26" rx="6"/><text x="376" y="289.5" text-anchor="middle">FastAPI</text></g>
    <g class="chip"><rect x="424" y="272" width="72" height="26" rx="6"/><text x="460" y="289.5" text-anchor="middle">Ollama</text></g>
  </g>
</svg>
