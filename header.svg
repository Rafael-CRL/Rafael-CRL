<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 250" width="860" height="250" role="img" aria-labelledby="t">
  <title id="t">Rafael Cristo Lobato — Sistemas de Informação, UFPA</title>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .in { animation: up .6s cubic-bezier(.2,.7,.2,1) both; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: .35s; } .d3 { animation-delay: .6s; }
    .d4 { animation-delay: .85s; } .d5 { animation-delay: 1.1s; }
    @keyframes up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .chip rect { fill: #161b22; stroke: #30363d; }
    .chip text { fill: #c9d1d9; font-size: 13px; }
    @media (prefers-reduced-motion: reduce) { .in { animation: none; } }
  </style>

  <rect x="0.5" y="0.5" width="859" height="249" rx="14" fill="#0d1117" stroke="#30363d"/>

  <g class="in d1">
    <text x="40" y="52" class="mono" font-size="14" fill="#8b949e">rafael@ufpa <tspan fill="#e3b341">~ $</tspan> whoami</text>
  </g>

  <g class="in d2">
    <text x="40" y="104" class="sans" font-size="38" font-weight="600" fill="#e6edf3">Rafael Cristo Lobato</text>
  </g>

  <g class="in d3">
    <text x="40" y="138" class="sans" font-size="17" fill="#8b949e">Sistemas de Informação · UFPA · Pará</text>
  </g>

  <g class="in d4">
    <text x="40" y="176" class="mono" font-size="15" fill="#c9d1d9"><tspan fill="#e3b341">&gt;</tspan> agentes de IA · backend · linux <tspan fill="#e3b341">▋<animate attributeName="fill-opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  </g>

  <g class="in d5 mono">
    <g class="chip"><rect x="40"  y="198" width="56" height="26" rx="6"/><text x="68"    y="215.5" text-anchor="middle">Java</text></g>
    <g class="chip"><rect x="104" y="198" width="72" height="26" rx="6"/><text x="140"   y="215.5" text-anchor="middle">Python</text></g>
    <g class="chip"><rect x="184" y="198" width="72" height="26" rx="6"/><text x="220"   y="215.5" text-anchor="middle">Docker</text></g>
    <g class="chip"><rect x="264" y="198" width="64" height="26" rx="6"/><text x="296"   y="215.5" text-anchor="middle">Linux</text></g>
    <g class="chip"><rect x="336" y="198" width="48" height="26" rx="6"/><text x="360"   y="215.5" text-anchor="middle">Git</text></g>
    <g class="chip"><rect x="392" y="198" width="72" height="26" rx="6"/><text x="428"   y="215.5" text-anchor="middle">Ollama</text></g>
  </g>
